name: Run Cloud Signal Predictor

on:
  workflow_dispatch:

jobs:
  execute-engine:
    runs-on: ubuntu-latest
    steps:
    - name: Download Code Repository
      uses: actions/checkout@v4

    - name: Instantiate Node Runtime
      uses: actions/setup-node@v4
      with:
        node-version: 22

    - name: Fire Prediction Engine
      run: node index.js
