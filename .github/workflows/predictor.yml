name: Run Cloud Signal Predictor

on:
  workflow_dispatch:

jobs:
  execute-engine:
    runs-on: ubuntu-latest
    steps:
    - name: Download Code Repository
      uses: actions/checkout@v4

    - name: Instantiate Node Runtime
      uses: actions/setup-node@v4
      with:
        node-version: 22

    # ✅ FIXED: Downloads live candle data via an unblocked native terminal proxy loop
    - name: Unblocked Live Data Stream Extraction
      run: |
        curl -s -L "https://allorigins.win" \
        -o live_market.json

    - name: Fire Prediction Engine
      run: node index.js
