name: Run Cloud Signal Predictor

on:
  workflow_dispatch:

jobs:
  execute-engine:
    runs-on: ubuntu-latest
    steps:
    - name: Download Code Repository
      uses: actions/checkout@v4

    - name: Instantiate Node Runtime
      uses: actions/setup-node@v4
      with:
        node-version: 22

    # FIX: Explicitly downloads the required network connection package inside the cloud runner
    - name: Install Secure Network Packages
      run: npm install ws

    - name: Fire Prediction Engine
      run: node index.js
